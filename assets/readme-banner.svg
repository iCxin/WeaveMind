<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="460" viewBox="0 0 1280 460" role="img" aria-label="织思 WeaveMind — 本地优先的思维导图工作台">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1522"/>
      <stop offset=".55" stop-color="#08101b"/>
      <stop offset="1" stop-color="#05080e"/>
    </linearGradient>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7fc9f4"/>
      <stop offset="1" stop-color="#2f6f9f"/>
    </linearGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset=".62" stop-color="#b9e3ff"/>
      <stop offset="1" stop-color="#5bd6a2"/>
    </linearGradient>
    <radialGradient id="logoCore" cx=".34" cy=".28" r=".85">
      <stop offset="0" stop-color="#ffe2b4"/>
      <stop offset=".42" stop-color="#f6b264"/>
      <stop offset=".8" stop-color="#dd7f2e"/>
      <stop offset="1" stop-color="#c4641c"/>
    </radialGradient>
    <radialGradient id="glowA" cx=".78" cy=".16" r=".62">
      <stop offset="0" stop-color="#2f6f9f" stop-opacity=".42"/>
      <stop offset="1" stop-color="#2f6f9f" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx=".1" cy=".9" r=".55">
      <stop offset="0" stop-color="#5bd6a2" stop-opacity=".13"/>
      <stop offset="1" stop-color="#5bd6a2" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M56 0H0V56" fill="none" stroke="#ffffff" stroke-opacity=".035"/>
    </pattern>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="10" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1280" height="460" fill="url(#bg)"/>
  <rect width="1280" height="460" fill="url(#grid)"/>
  <rect width="1280" height="460" fill="url(#glowA)"/>
  <rect width="1280" height="460" fill="url(#glowB)"/>

  <g transform="translate(72 78)">
    <rect width="66" height="66" rx="18" fill="url(#brand)"/>
    <rect x="1" y="1" width="64" height="64" rx="17" fill="none" stroke="#ffffff" stroke-opacity=".16"/>
    <g fill="none" stroke="#eaf6ff" stroke-linecap="round">
      <path d="M33 33C28.6 27.2 24.1 22.5 18.4 18.2" stroke-width="3.3" stroke-opacity=".92"/>
      <path d="M33 33C29.1 38.5 24.6 43.5 19.2 47.8" stroke-width="3.3" stroke-opacity=".92"/>
      <path d="M33 33C39.4 32.4 44.1 31.8 49.8 31.2" stroke-width="3.3" stroke-opacity=".92"/>
    </g>
    <g fill="#ffffff">
      <circle cx="17.8" cy="17.6" r="3.8"/>
      <circle cx="18.4" cy="48.4" r="3.8"/>
      <circle cx="50.4" cy="31.1" r="3.8"/>
    </g>
    <circle cx="33" cy="33" r="9.3" fill="#0c2b3f" fill-opacity=".22"/>
    <circle cx="33" cy="33" r="7.6" fill="url(#logoCore)"/>
    <circle cx="33" cy="33" r="2.4" fill="#ffffff" fill-opacity=".94"/>
  </g>

  <text x="154" y="108" fill="#f2f8ff" font-family="'Microsoft YaHei','PingFang SC',system-ui,sans-serif"
    font-size="28" font-weight="700" letter-spacing="2">织思</text>
  <text x="154" y="132" fill="#8fa7bd" font-family="'SFMono-Regular',Consolas,monospace"
    font-size="11" letter-spacing="4.4">WEAVEMIND</text>

  <text x="72" y="218" fill="url(#title)" font-family="'Microsoft YaHei','PingFang SC',system-ui,sans-serif"
    font-size="54" font-weight="800" letter-spacing="-1.6">把复杂想法，织成一张清晰的图。</text>
  <text x="74" y="258" fill="#9aacc0" font-family="'Microsoft YaHei','PingFang SC',system-ui,sans-serif"
    font-size="17" letter-spacing=".6">离线优先的思维导图工作台 · 导图 / 大纲 / 演说 / 甘特四视图同源</text>

  <g transform="translate(74 300)">
    <rect width="126" height="34" rx="17" fill="#ffffff" fill-opacity=".055" stroke="#ffffff" stroke-opacity=".13"/>
    <text x="63" y="22" text-anchor="middle" fill="#d7e7f5" font-family="'Microsoft YaHei','PingFang SC',sans-serif" font-size="12">零运行时依赖</text>
    <rect x="136" width="126" height="34" rx="17" fill="#ffffff" fill-opacity=".055" stroke="#ffffff" stroke-opacity=".13"/>
    <text x="199" y="22" text-anchor="middle" fill="#d7e7f5" font-family="'Microsoft YaHei','PingFang SC',sans-serif" font-size="12">100% 本地存储</text>
    <rect x="272" width="140" height="34" rx="17" fill="#ffffff" fill-opacity=".055" stroke="#ffffff" stroke-opacity=".13"/>
    <text x="342" y="22" text-anchor="middle" fill="#d7e7f5" font-family="'Microsoft YaHei','PingFang SC',sans-serif" font-size="12">十种布局结构</text>
    <rect x="422" width="128" height="34" rx="17" fill="#ffffff" fill-opacity=".055" stroke="#ffffff" stroke-opacity=".13"/>
    <text x="486" y="22" text-anchor="middle" fill="#d7e7f5" font-family="'Microsoft YaHei','PingFang SC',sans-serif" font-size="12">MIT 开源</text>
  </g>

  <g transform="translate(872 96)" font-family="'Microsoft YaHei','PingFang SC',sans-serif">
    <g fill="none" stroke-linecap="round" opacity=".8">
      <path d="M164 160 C120 160 100 84 46 72" stroke="#4f9bd8" stroke-width="1.6"/>
      <path d="M164 160 C120 160 100 160 46 160" stroke="#46a37a" stroke-width="1.6"/>
      <path d="M164 160 C120 160 100 236 46 248" stroke="#c08a3a" stroke-width="1.6"/>
      <path d="M240 160 C286 160 306 84 360 72" stroke="#8b6bb0" stroke-width="1.6"/>
      <path d="M240 160 C286 160 306 160 360 160" stroke="#cf6b48" stroke-width="1.6"/>
      <path d="M240 160 C286 160 306 236 360 248" stroke="#4a8a9a" stroke-width="1.6"/>
    </g>
    <g filter="url(#soft)">
      <rect x="118" y="136" width="168" height="48" rx="14" fill="#255a83"/>
      <text x="202" y="166" text-anchor="middle" fill="#ffffff" font-size="14" font-weight="700">织思 WeaveMind</text>
    </g>
    <g fill="#0d1a29" stroke="#ffffff" stroke-opacity=".16">
      <rect x="0" y="56" width="120" height="34" rx="9"/>
      <rect x="0" y="143" width="120" height="34" rx="9"/>
      <rect x="0" y="230" width="120" height="34" rx="9"/>
      <rect x="334" y="56" width="120" height="34" rx="9"/>
      <rect x="334" y="143" width="120" height="34" rx="9"/>
      <rect x="334" y="230" width="120" height="34" rx="9"/>
    </g>
    <g fill="#cfe3f4" font-size="11.5">
      <text x="60" y="77" text-anchor="middle">需求与调研</text>
      <text x="60" y="164" text-anchor="middle">设计与架构</text>
      <text x="60" y="251" text-anchor="middle">开发实现</text>
      <text x="394" y="77" text-anchor="middle">测试与质量</text>
      <text x="394" y="164" text-anchor="middle">核心体验</text>
      <text x="394" y="251" text-anchor="middle">发布计划</text>
    </g>
  </g>

  <text x="1208" y="420" text-anchor="end" fill="#5c7287" font-family="'SFMono-Regular',Consolas,monospace"
    font-size="10" letter-spacing="2.4">LOCAL-FIRST · ZERO DEPENDENCY · BUILT WITH TRAE</text>
</svg>
